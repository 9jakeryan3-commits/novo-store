<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="NoVo">
  <!-- 01 "The Flip" — a solid N with the gamma-flip channel cut through it,
       the axis running past on both sides. Inherits colour via currentColor. -->
  <mask id="novo-flip-channel">
    <rect width="120" height="120" fill="#fff"/>
    <rect y="56" width="120" height="8" fill="#000"/>
  </mask>
  <path d="M16,104 L16,16 L34,16 L86,78 L86,16 L104,16 L104,104 L86,104 L34,42 L34,104 Z"
        fill="currentColor" mask="url(#novo-flip-channel)"/>
  <rect x="2" y="56" width="14" height="8" fill="currentColor"/>
  <rect x="104" y="56" width="14" height="8" fill="currentColor"/>
</svg>
