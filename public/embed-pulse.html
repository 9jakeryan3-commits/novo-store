<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var GZ=[{max:25,c:'#ef4444'},{max:45,c:'#f97316'},{max:55,c:'#eab308'},{max:75,c:'#84cc16'},{max:101,c:'#22c55e'}];
  function ago(ts){ if(!ts) return ''; var m=Math.max(0,Math.round((Date.now()-ts)/60000)); return 'Updated '+(m<1?'just now':m+' min ago'); }
  function render(p){
    if(!p) return;
    var sc=Math.max(0,Math.min(100,p.score));
    $('num').textContent=p.score;
    var zi=0; for(var i=0;i<GZ.length;i++){ if(sc<GZ[i].max){ zi=i; break; } }
    var zc=GZ[zi].c;
    var l=$('lbl'); l.textContent=p.label||''; l.style.color=zc;
    for(var s=0;s<5;s++){ var seg=$('seg'+s); if(seg) seg.style.opacity=(s===zi)?'1':'0.24';
      var zt=$('zt'+s); if(zt) zt.style.fill=(s===zi)?zc:'#506e8f'; }
    var n=$('needle'); if(n) n.setAttribute('transform','rotate('+(1.8*sc-90)+' 170 182)');
  }
  function load(){ fetch('https://novo-options.trade/api/market-pulse',{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){ if(d){ render(d.pulse); $('ago').textContent=ago(d.updated); } }).catch(function(){}); }
  load(); setInterval(load,120000);
})();
</script>
